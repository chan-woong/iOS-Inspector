name: Windows build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish self-contained Windows x64 build
        run: dotnet publish -c Release -r win-x64 --self-contained true -o publish -p:AssemblyName=IosInspector

      - name: Create release archive and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath iOS-Inspector-win-x64.zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 iOS-Inspector-win-x64.zip).Hash
          "$hash  iOS-Inspector-win-x64.zip" | Set-Content -Encoding ascii SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Inspector-win-x64
          path: |
            iOS-Inspector-win-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" iOS-Inspector-win-x64.zip SHA256SUMS.txt --generate-notes --title "iOS Inspector $env:GITHUB_REF_NAME"
